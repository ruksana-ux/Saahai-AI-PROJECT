[theme]
primaryColor = "#00796B"
backgroundColor = "#F4F7F6"
secondaryBackgroundColor = "#E6F0ED"
textColor = "#142328"
font = "sans serif"

[server]
headless = true
# Keep the defaults secure. The previous file disabled XSRF protection and CORS.
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 25

[browser]
gatherUsageStats = false
