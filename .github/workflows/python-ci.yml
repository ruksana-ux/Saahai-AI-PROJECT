name: Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Compile all Python modules
        run: python -m compileall -q app.py *_engine.py tests

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = []
          for path in pathlib.Path('.').rglob('*.json'):
              if '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              try:
                  json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  bad.append(f'{path}: {exc}')
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          print('JSON OK')
          PY

      - name: Run tests
        run: pytest --cov=. --cov-report=term-missing

  legacy-import:
    # The Streamlit prototype must at least import and construct its engines
    # without a secrets file. This catches the old startup crash.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Import engines
        run: |
          python - <<'PY'
          from rag_engine import SahaayaRAGEngine
          from currency_engine import SahaayaCurrencyEngine
          from scheme_engine import SchemeEngine
          from document_engine import read_document
          from aac_engine import SahaayaAACEngine
          from isl_engine import SahaayaISLEngine
          from classroom_engine import SahaayaClassroomEngine

          SahaayaRAGEngine(kb_dir='knowledge_base')
          SahaayaCurrencyEngine(model_path='missing.tflite', meta_path='missing.json')
          SchemeEngine('data/schemes/schemes.json')
          SahaayaAACEngine()
          SahaayaISLEngine()
          SahaayaClassroomEngine()
          print('engines import OK')
          PY
